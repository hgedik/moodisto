# ---------------------------------------------------------------------------
# One origin in front of two services
# ---------------------------------------------------------------------------
# The web image is built without a hard-coded API address: the browser looks
# for the API on the page's own origin. That only works behind a proxy that
# routes by path, which is what the server does and what this file reproduces
# locally. The routing table below is the one a server's reverse proxy needs.

upstream moodisto_api {
    server api:3001;
}

upstream moodisto_web {
    server web:3000;
}

# `Connection: upgrade` only while the client actually asked for an upgrade;
# an unconditional header breaks plain HTTP requests on the same connection.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # Requests carry a search query and a track id, nothing large.
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The API counts requests per client address and trusts one proxy hop
    # (`trust proxy` in main.ts). Without these headers every guest would share
    # a single rate-limit bucket — this proxy's address.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://moodisto_api;
    }

    # Without the upgrade the socket silently falls back to long polling and
    # the realtime views turn into something that looks like a slow network.
    location /socket.io/ {
        proxy_pass http://moodisto_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://moodisto_web;
    }
}
